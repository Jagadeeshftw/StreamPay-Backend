name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # npm's optional native resolver metadata can drift between npm minor
        # versions; install from the lockfile while allowing npm to refresh
        # those platform-specific optional entries on the runner.
        run: npm install --no-audit --no-fund

      - name: Run linter
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        run: npm test
